name: Validate, publish, and deploy StarSnap SNS web

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "deploy/**"
      - "design-system/**"
      - "dockerfile"
      - "index.html"
      - "nginx.conf"
      - "package.json"
      - "package-lock.json"
      - "public/**"
      - "src/**"
      - "tsconfig*.json"
      - "vite.config.*"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this exact commit to starsnap-sns_web
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sns-web-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/starsnap/starsnap-sns-web

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Validate deployment script
        shell: bash
        run: bash -n deploy/deploy-production.sh

      - name: Test scoped rollout and rollback
        run: >-
          docker run --rm --tmpfs /runner-state
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          bash:5.2@sha256:3bee76a96d86d5d2d5efc7c1c570e5a7c95db22348a26944e0e546fa174e3324
          bash /repo/deploy/test-deploy-production.sh /repo

      - name: Validate recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source deploy/stack.env.example
          set +a
          docker stack config --compose-file deploy/stack.yml >/dev/null

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable ARM64 execution
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    needs:
      - quality
      - publish
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy &&
      github.ref == 'refs/heads/main' &&
      vars.SWARM_DEPLOY_ENABLED == 'true'
    runs-on:
      group: starsnap-production
      labels: starsnap-swarm
    environment: production
    timeout-minutes: 20
    concurrency:
      group: starsnap-sns-web-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_CONFIG: /tmp/starsnap-sns-web-${{ github.run_id }}-${{ github.run_attempt }}
      STARSNAP_DEPLOY_IMAGE: ghcr.io/starsnap/starsnap-sns-web@${{ needs.publish.outputs.digest }}
      STARSNAP_PULL_IMAGE: ghcr.io/starsnap/starsnap-sns-web:sha-${{ github.sha }}
      STARSNAP_DEPLOY_LOCK_PATH: /runner-state/starsnap-production-deploy.lock
    steps:
      - name: Check out deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Prepare isolated Docker client state
        shell: bash
        run: install -d -m 0700 "$DOCKER_CONFIG"

      - name: Sign in to GHCR for deployment
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy only StarSnap SNS web
        shell: bash
        run: bash deploy/deploy-production.sh

      - name: Remove isolated Docker client state
        if: always()
        shell: bash
        run: |
          expected="/tmp/starsnap-sns-web-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$DOCKER_CONFIG" = "$expected"
          docker logout ghcr.io >/dev/null 2>&1 || true
          if [ -d "$DOCKER_CONFIG" ]; then
            find "$DOCKER_CONFIG" -depth -delete
          fi
